<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Калькулятор доставки</title>
    
    <!-- Шрифты и библиотеки -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* Базовые настройки */
        body { 
            font-family: 'Inter', sans-serif; 
            color: #0f172a; 
            touch-action: manipulation;
            -webkit-font-smoothing: antialiased;
        }
        button, input { touch-action: manipulation; }

        /* Кастомный скроллбар */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        body.modal-open { overflow: hidden; touch-action: none; }

        /* Мобильный островок калькулятора */
        @media (max-width: 768px) {
            .mobile-cart-sheet {
                max-height: 62px; 
                transition: max-height 0.4s cubic-bezier(0.2, 1, 0.3, 1);
            }
            .mobile-cart-sheet.is-open { max-height: 75dvh; }
            
            .mobile-cart-content {
                opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
            }
            .mobile-cart-sheet.is-open .mobile-cart-content {
                opacity: 1; pointer-events: auto; transition: opacity 0.3s ease 0.15s; 
            }
            .mobile-cart-sheet:not(.is-open) .cart-header-border { border-color: transparent; }
        }
    </style>
</head>
<body class="pb-28 md:pb-8 bg-[#f1f5f9] min-h-screen relative">

    <!-- ШАПКА -->
    <div class="sticky top-3 sm:top-5 z-40 w-full pointer-events-none mb-6 sm:mb-8">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 pointer-events-auto w-full">
            <div class="relative shadow-[0_8px_30px_rgb(0,0,0,0.06)] rounded-[1.2rem] bg-white/80 backdrop-blur-xl border border-white/60 px-5 py-4 flex items-center justify-between">
                <h1 class="font-extrabold text-slate-800 text-lg">Калькулятор доставки</h1>
            </div>
        </div>
    </div>

    <!-- ОСНОВНОЙ КОНТЕЙНЕР -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 flex flex-col md:flex-row gap-6 items-start">
        
        <!-- СПИСОК ПОЗИЦИЙ -->
        <div class="flex-1 w-full">
            <div id="calcGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 sm:gap-5">
                <!-- Карточки генерируются через JS -->
            </div>
        </div>

        <!-- ИТОГИ (ОСТРОВОК) -->
        <div id="esCartWidget" class="mobile-cart-sheet md:transform-none fixed md:sticky md:top-24 bottom-4 inset-x-0 md:bottom-auto z-50 md:z-10 w-full md:w-80 lg:w-96 bg-transparent flex flex-col mx-auto px-4 sm:px-6 md:px-0 md:max-h-[calc(100vh-7rem)]">
            
            <div class="bg-white rounded-[1.2rem] md:rounded-[1.5rem] border border-slate-200/80 shadow-[0_12px_40px_-10px_rgba(0,0,0,0.15)] md:shadow-[0_4px_20px_-2px_rgba(0,0,0,0.03)] flex flex-col flex-1 min-h-0 overflow-hidden">
                
                <!-- Шапка виджета -->
                <div class="cart-header-border p-4 sm:p-5 border-b border-slate-100 flex justify-between items-center bg-slate-900 md:bg-white text-white md:text-slate-900 cursor-pointer md:cursor-default transition-colors shrink-0 touch-none md:touch-auto" onclick="toggleMobileCart()">
                    <div class="flex items-center gap-2">
                        <h2 class="font-extrabold text-lg">Расчет стоимости</h2>
                        <span id="cart-count-badge" class="bg-blue-500 md:bg-slate-100 md:text-slate-600 text-white text-xs font-bold px-2 py-0.5 rounded-full hidden">0</span>
                    </div>
                    <svg id="mobile-cart-arrow" class="w-6 h-6 md:hidden transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path></svg>
                </div>

                <!-- Контент расчета -->
                <div class="mobile-cart-content flex flex-col flex-1 overflow-hidden min-h-0">
                    
                    <!-- Выбранные товары -->
                    <div id="esCartItems" class="flex-1 overflow-y-auto overscroll-y-contain p-4 sm:p-5 bg-[#f1f5f9]/50">
                        <div class="text-center py-8 text-slate-400 font-medium text-sm">Добавьте позиции</div>
                    </div>

                    <!-- Математика и Итого -->
                    <div class="p-4 sm:p-5 bg-white border-t border-slate-100 shrink-0">
                        
                        <div class="space-y-2 mb-4 border-b border-dashed border-slate-200 pb-4">
                            <div class="flex justify-between text-sm font-semibold text-slate-500">
                                <span>Сумма позиций:</span>
                                <span id="calcBaseSum" class="text-slate-800">0 ₽</span>
                            </div>
                            <div class="flex justify-between text-sm font-semibold text-slate-500">
                                <span>Доставка (15%):</span>
                                <span id="calcPercentSum" class="text-blue-600">+ 0 ₽</span>
                            </div>
                        </div>

                        <div class="flex justify-between items-end mb-4">
                            <span class="text-slate-500 font-bold mb-1">Итого к оплате:</span>
                            <span id="calcTotalSum" class="text-2xl font-extrabold text-slate-900 tracking-tight">0 ₽</span>
                        </div>
                        
                        <button class="w-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold p-3 rounded-[1rem] transition-colors text-sm" onclick="clearCalculator(event)">
                            Сбросить расчет
                        </button>
                    </div>
                    
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // НАСТРОЙКИ КАЛЬКУЛЯТОРА
        // ============================================
        
        // Процент за доставку (0.15 = 15%)
        const DELIVERY_PERCENT = 0.15; 
        
        // Список товаров и их базовая стоимость
        // Вы можете менять значение 'price' на нужное вам в любой момент
        let deliveryItems = [
            { name: "2д комплект 2 ряда", price: 1000, qty: 0 },
            { name: "2д комплект 3 ряда", price: 1000, qty: 0 },
            { name: "3д комплект", price: 1000, qty: 0 },
            { name: "Коврики для минивэна", price: 1000, qty: 0 },
            { name: "Коврик багажник", price: 1000, qty: 0 },
            { name: "Органайзер", price: 1000, qty: 0 },
            { name: "Сумка", price: 1000, qty: 0 }
        ];

        const fmt = (n) => new Intl.NumberFormat('ru-RU').format(Math.round(n)) + ' ₽';
        
        // ============================================
        // ЛОГИКА РЕНДЕРА И РАСЧЕТОВ
        // ============================================

        function renderItems() {
            const grid = document.getElementById('calcGrid');
            grid.innerHTML = '';
            
            deliveryItems.forEach((item, idx) => {
                let card = document.createElement('div');
                card.className = 'bg-white p-4 sm:p-5 rounded-[1.5rem] border border-slate-200 shadow-[0_4px_20px_-2px_rgba(0,0,0,0.03)] flex flex-col justify-between transition-all hover:border-blue-400 hover:shadow-[0_8px_25px_-5px_rgba(0,0,0,0.06)]';
                
                let activeStyle = item.qty > 0 ? "border-blue-500 bg-blue-500 text-white" : "border-slate-300 bg-white text-slate-600";
                
                card.innerHTML = `
                    <div class="mb-4">
                        <div class="font-bold text-slate-800 text-sm sm:text-base leading-snug mb-1">${item.name}</div>
                        <div class="text-slate-400 text-xs font-semibold">${fmt(item.price)} / шт.</div>
                    </div>
                    <div class="flex items-center justify-between mt-auto pt-4 border-t border-slate-100">
                        <span class="font-extrabold text-blue-600 text-base">${fmt(item.price * (item.qty > 0 ? item.qty : 1))}</span>
                        
                        <div class="flex items-center gap-2 bg-slate-50 border border-slate-200 p-1 rounded-full shadow-sm">
                            <button class="w-8 h-8 flex items-center justify-center bg-white hover:bg-slate-100 rounded-full text-slate-600 font-bold transition-colors shadow-sm text-lg" onclick="changeQty(${idx}, -1)">-</button>
                            <span class="w-6 text-center font-bold ${item.qty > 0 ? 'text-slate-900' : 'text-slate-400'} text-sm">${item.qty}</span>
                            <button class="w-8 h-8 flex items-center justify-center bg-white hover:bg-slate-100 rounded-full text-slate-600 font-bold transition-colors shadow-sm text-lg" onclick="changeQty(${idx}, 1)">+</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function changeQty(idx, delta) {
            let item = deliveryItems[idx];
            let newQty = item.qty + delta;
            if(newQty < 0) newQty = 0;
            
            // Если добавляем самый первый товар на мобилке, показываем островок
            let totalQtyBefore = deliveryItems.reduce((sum, i) => sum + i.qty, 0);
            item.qty = newQty;
            let totalQtyAfter = deliveryItems.reduce((sum, i) => sum + i.qty, 0);

            if (totalQtyBefore === 0 && totalQtyAfter === 1 && window.innerWidth <= 768) {
                const widget = document.getElementById('esCartWidget');
                const arrow = document.getElementById('mobile-cart-arrow');
                widget.classList.add('is-open');
                arrow.style.transform = 'rotate(180deg)';
            }

            renderItems();
            updateSummary();
        }

        function updateSummary() {
            let baseTotal = 0;
            let itemsCount = 0;
            const list = document.getElementById('esCartItems');
            list.innerHTML = "";

            deliveryItems.forEach((item, idx) => {
                if (item.qty > 0) {
                    baseTotal += item.price * item.qty;
                    itemsCount += item.qty;
                    
                    let row = document.createElement('div');
                    row.className = 'bg-white p-3 rounded-[1rem] border border-slate-100 shadow-[0_2px_10px_-2px_rgba(0,0,0,0.03)] mb-2 relative group';
                    row.innerHTML = `
                        <div class="flex justify-between items-center">
                            <div class="font-bold text-slate-800 text-sm leading-tight pr-4">
                                ${item.name} 
                                <span class="text-blue-500 ml-1 text-xs px-1.5 py-0.5 bg-blue-50 rounded-md">x${item.qty}</span>
                            </div>
                            <button class="text-slate-300 hover:text-rose-500 transition-colors p-1" onclick="changeQty(${idx}, -${item.qty})">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                            </button>
                        </div>
                        <div class="text-xs font-semibold text-slate-500 mt-1">${fmt(item.price * item.qty)}</div>
                    `;
                    list.appendChild(row);
                }
            });

            if(itemsCount === 0) {
                list.innerHTML = "<div class='text-center py-8 text-slate-400 font-medium text-sm'>Добавьте позиции</div>";
            }

            let percentSum = baseTotal * DELIVERY_PERCENT;
            let finalSum = baseTotal + percentSum;

            document.getElementById('calcBaseSum').innerText = fmt(baseTotal);
            document.getElementById('calcPercentSum').innerText = '+ ' + fmt(percentSum);
            document.getElementById('calcTotalSum').innerText = fmt(finalSum);

            const badge = document.getElementById('cart-count-badge');
            if(itemsCount > 0) {
                badge.innerText = itemsCount;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        window.clearCalculator = function(e) { 
            if(e) e.stopPropagation(); 
            deliveryItems.forEach(item => item.qty = 0);
            renderItems();
            updateSummary();
            
            if(window.innerWidth <= 768) {
                document.getElementById('esCartWidget').classList.remove('is-open');
                document.getElementById('mobile-cart-arrow').style.transform = 'rotate(0deg)';
            }
        }

        window.toggleMobileCart = function() {
            if(window.innerWidth <= 768) {
                const widget = document.getElementById('esCartWidget');
                const arrow = document.getElementById('mobile-cart-arrow');
                widget.classList.toggle('is-open');
                arrow.style.transform = widget.classList.contains('is-open') ? 'rotate(180deg)' : 'rotate(0deg)';
            }
        }

        // Первичный рендер при загрузке
        renderItems();
        updateSummary();

    </script>
</body>
</html>
